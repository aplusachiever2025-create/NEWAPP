<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SG Tutor Match · 管理后台</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#182235;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:22px 16px}.panel{background:white;border:1px solid #e1e8f0;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}input{padding:11px;border:1px solid #cbd5e1;border-radius:9px;width:100%;margin:6px 0 12px}button{border:0;border-radius:9px;background:#183b56;color:white;padding:10px 14px;cursor:pointer;margin:3px}.muted{color:#64748b;font-size:13px;line-height:1.5}.hidden{display:none!important}.record{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:9px 0;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{display:inline-block;background:#e2eaf2;border-radius:999px;padding:4px 8px;font-size:12px}.error{color:#b91c1c}
</style></head><body><main class="wrap"><h1>SG Tutor Match · 管理后台</h1><p class="muted">仅授权管理员使用。家长与导师联系方式只在登录后显示，不会向公开访客提供。</p>
<section id="loginPanel" class="panel"><h2>管理员登录</h2><form onsubmit="login(event)"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">登录</button><p id="loginMsg" class="muted" aria-live="polite"></p></form></section>
<section id="dataPanel" class="hidden"><div class="row"><h2>资料管理</h2><div><button onclick="refresh()">刷新资料</button><button onclick="match()">自动配对</button><button onclick="logout()">退出登录</button></div></div><p id="msg" class="muted" aria-live="polite"></p><div class="grid"><section class="panel"><h3>家长需求</h3><div id="parents"></div></section><section class="panel"><h3>导师资料</h3><div id="tutors"></div></section><section class="panel"><h3>配对建议</h3><div id="matches"></div></section></div></section>
<div id="gasNotice" class="panel muted hidden">请通过 Apps Script Web App 地址打开此后台，而不是直接通过 GitHub Pages 打开。</div></main><script>
let token='';
function gas(){return typeof google!=='undefined'&&google.script&&google.script.run}
function login(e){e.preventDefault();const m=document.getElementById('loginMsg');if(!gas()){m.textContent='Apps Script 尚未连接；当前没有进行登录。';return}m.textContent='验证中…';google.script.run.withSuccessHandler(r=>{token=r.token;document.getElementById('loginPanel').classList.add('hidden');document.getElementById('dataPanel').classList.remove('hidden');refresh()}).withFailureHandler(err=>m.textContent=err.message||String(err)).adminLogin(document.getElementById('password').value)}
function refresh(){if(!gas())return;document.getElementById('msg').textContent='正在读取…';google.script.run.withSuccessHandler(d=>{render('parents',d.parents,'parent');render('tutors',d.tutors,'tutor');render('matches',d.matches,'match');document.getElementById('msg').textContent='资料已刷新。私人联系方式仅供管理员处理撮合。'}).withFailureHandler(err=>document.getElementById('msg').textContent=err.message||String(err)).adminGetData(token)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(id,rows,type){const el=document.getElementById(id);if(!rows.length){el.innerHTML='<p class="muted">暂无资料</p>';return}el.innerHTML=rows.slice().reverse().map(r=>{let title=type==='parent'?(r.contact_name+' · '+r.level+' · '+r.subject):type==='tutor'?(r.name+' · '+r.level):('配对建议 · '+r.score+' 分');let details=type==='parent'?['电话：'+r.contact_phone,'微信：'+r.contact_wechat,'WhatsApp：'+r.contact_whatsapp,'预算：'+r.budget,'地区：'+r.region,'模式：'+r.mode,'时间：'+r.timeslot,'状态：'+r.status]:type==='tutor'?['电话：'+r.contact_phone,'邮箱：'+r.contact_email,'WhatsApp：'+r.whatsapp,'科目：'+r.subjects,'收费：'+r.rate,'地区：'+r.regions,'模式：'+r.mode,'状态：'+r.status]:['家长 ID：'+r.parent_id,'导师 ID：'+r.tutor_id,r.reason,'状态：'+r.status];return '<article class="record"><div class="row"><strong>'+esc(title)+'</strong><span class="pill">'+esc(r.status||'suggested')+'</span></div><p class="muted">'+details.map(x=>esc(x)).join('<br>')+'</p>'+(type!=='match'?'<button onclick="removeRecord(\''+type+'\',\''+esc(r.id)+'\')">移除</button>':'')+'</article>'}).join('')}
function removeRecord(type,id){if(!confirm('确定将这条资料标记为移除？'))return;google.script.run.withSuccessHandler(refresh).withFailureHandler(err=>document.getElementById('msg').textContent=err.message||String(err)).adminRemove(token,type,id)}
function match(){document.getElementById('msg').textContent='正在生成候选配对…';google.script.run.withSuccessHandler(r=>{document.getElementById('msg').textContent=r.message;refresh()}).withFailureHandler(err=>document.getElementById('msg').textContent=err.message||String(err)).runSmartMatch(token)}
function logout(){google.script.run.withSuccessHandler(()=>location.reload()).adminLogout(token)}
if(!gas())document.getElementById('gasNotice').classList.remove('hidden');
</script></body></html>
